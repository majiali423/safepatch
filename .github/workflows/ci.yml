name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: >-
          python -m pytest -q -m "not docker_e2e and not packaging_network"
          -p no:cacheprovider
          --basetemp .test-artifacts

  quality:
    name: Product quality and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint product code
        run: python -m ruff check code_agent tests devtools
      - name: Type-check analysis loop boundary
        run: python -m mypy
      - name: Compile product modules
        run: python -m compileall -q code_agent
      - name: Offline mechanism experiment
        run: python examples/agent_experiments/run_offline.py
      - name: Verify published benchmark evidence
        run: |
          python examples/real_bug_benchmark/verify_published_results.py
          python examples/real_bug_benchmark/verify_preflight_ablation.py
          python examples/llm_benchmark/verify_manifest.py
      - name: Build distributions
        run: python -m build
      - name: Create clean smoke environment
        run: python -m venv .smoke-venv
      - name: Install wheel
        run: .smoke-venv/bin/python -m pip install dist/*.whl
      - name: Create isolated smoke working directory
        run: mkdir .smoke-work
      - name: Verify packaged Docker runtime asset
        working-directory: .smoke-work
        run: >-
          ../.smoke-venv/bin/python -c
          "from importlib.resources import files;
          assert (files('code_agent.runtime') / 'Dockerfile.pytest').is_file()"
      - name: Run installed CLI smoke test
        working-directory: .smoke-work
        run: ../.smoke-venv/bin/safepatch --help

  packaging-network:
    name: Packaging network
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run packaging_network tests
        run: >-
          python -m pytest -q -m packaging_network
          -p no:cacheprovider
          --basetemp .packaging-test-artifacts

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build pinned pytest image
        run: safepatch --build-image
      - name: Run Docker E2E tests
        env:
          SAFEPATCH_REQUIRE_DOCKER_E2E: "1"
        run: >-
          python -m pytest -q -m docker_e2e
          -p no:cacheprovider
          --basetemp .docker-test-artifacts
