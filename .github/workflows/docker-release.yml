name: Docker release tests

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  docker-e2e:
    name: Docker security E2E (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build local pytest image
        run: >-
          docker build
          -t safepatch-pytest:local
          -f code_agent/runtime/Dockerfile.pytest
          code_agent/runtime
      - name: Run Docker E2E tests
        run: >-
          python -m pytest -q -ra
          -m docker_e2e
          -p no:cacheprovider
          --basetemp .docker-test-artifacts/pytest
      - name: Upload Docker test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-artifacts
          path: .docker-test-artifacts
          if-no-files-found: warn
