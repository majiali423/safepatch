[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safepatch"
version = "0.3.1"
description = "A small-Python-repo code repair agent with Docker pytest and human approval"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jiali Ma" },
]
keywords = ["agent", "code-repair", "llm", "pytest", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "openai>=1.40.0",
  "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/majiali423/safepatch"
Source = "https://github.com/majiali423/safepatch"
Issues = "https://github.com/majiali423/safepatch/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
safepatch = "code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]

[tool.setuptools.package-data]
code_agent = ["runtime/Dockerfile.pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require a working Docker pytest runtime",
  "docker_e2e: real Docker negative/security E2E (serial; skips if daemon unavailable)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
