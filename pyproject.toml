[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.3.1"
description = "A small-Python-repo code repair agent with Docker pytest and human approval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]

[tool.setuptools.package-data]
code_agent = ["runtime/Dockerfile.pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require a working Docker pytest runtime",
  "docker_e2e: real Docker negative/security E2E (serial; skips if daemon unavailable)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
